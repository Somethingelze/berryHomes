<!DOCTYPE html>
<!-- Пространство имен Thymeleaf и локализация хедера -->
<html xmlns:th="http://thymeleaf.org" lang="en">
<head></head>
<body>

<header th:fragment="site-header" class="header">
    <div class="header-container">

        <!-- Логотип компании -->
        <div class="logo">
            <img th:src="@{/images/logo-etc/berryhomes_logo_wide.png}" alt="Berry Homes Logo">
        </div>

        <!-- Навигационное меню шапки сайта -->
        <nav class="nav-menu">
            <!-- Ссылки главного меню -->
            <div class="nav-links-group">
                <a href="#">Blog</a>
                <span class="nav-divider"></span>
                <a href="#">About Us</a>
                <span class="nav-divider"></span>
                <a href="#">Contact</a>
            </div>

            <!-- Кнопка Go Portal -->
            <a href="#" class="nav-icon-link">
                <svg class="nav-svg-icon" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="32" cy="22" r="10"/>
                    <path d="M14 52 C14 39 21 32 32 32 C43 32 50 39 50 52"/>
                </svg>
                <span>Go Portal</span>
            </a>

            <!-- Выбор языка -->
            <a href="#" class="nav-icon-link">
                <svg class="nav-svg-icon" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="32" cy="32" r="22"/>
                    <ellipse cx="32" cy="32" rx="9" ry="22"/>
                    <line x1="10" y1="32" x2="54" y2="32"/>
                    <path d="M13 21 H51"/>
                    <path d="M13 43 H51"/>
                </svg>
                <span>Language ▾</span>
            </a>

            <!-- Локация -->
            <a href="#" class="nav-icon-link location">
                <svg class="nav-svg-icon" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M32 58 C32 58 14 40 14 26 C14 15 22 7 32 7 C42 7 50 15 50 26 C50 40 32 58 32 58 Z"/>
                    <circle cx="32" cy="26" r="7"/>
                </svg>
                <span>Pittsburgh, PA</span>
            </a>
        </nav>
    </div>
</header>

</body>
</html>
