<!DOCTYPE html>
<!-- Элемент html формирует соответствующую часть интерфейса. -->
<html lang="en" xmlns:th="http://thymeleaf.org">
<!-- Элемент head формирует соответствующую часть интерфейса. -->
<head>
    <!-- Элемент meta формирует соответствующую часть интерфейса. -->
    <meta charset="UTF-8">
    <!-- Элемент meta формирует соответствующую часть интерфейса. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Элемент title формирует соответствующую часть интерфейса. -->
    <title>Page Not Found - Berry Homes</title>
    <!-- Элемент script формирует соответствующую часть интерфейса. -->
    <script src="https://cdn.tailwindcss.com">
</script>
    <!-- Элемент link формирует соответствующую часть интерфейса. -->
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<!-- Элемент body формирует соответствующую часть интерфейса. -->
<body class="bg-slate-50 font-sans flex flex-col justify-center items-center min-h-screen text-center p-4">

<!-- Элемент div формирует соответствующую часть интерфейса. -->
<div class="max-w-md bg-white p-8 rounded-xl shadow-sm border border-slate-100">
    <!-- Элемент div формирует соответствующую часть интерфейса. -->
    <div class="text-6xl text-emerald-600 mb-4">
<i class="bi bi-exclamation-circle-fill">
</i>
</div>
    <!-- Элемент h1 формирует соответствующую часть интерфейса. -->
    <h1 class="text-4xl font-black text-slate-900 mb-2">404</h1>
    <!-- Элемент h2 формирует соответствующую часть интерфейса. -->
    <h2 class="text-xl font-bold text-slate-700 mb-4">Resource Not Found</h2>

    <!-- Динамический вывод сообщения из нашего ExceptionHandler -->
    <!-- Элемент p формирует соответствующую часть интерфейса. -->
    <p class="text-sm text-gray-500 leading-relaxed mb-8" th:text="${message}">
        The page or property project you are looking for does not exist or has been archived.
    </p>

    <!-- Элемент a формирует соответствующую часть интерфейса. -->
    <a href="/" class="inline-flex items-center gap-2 bg-emerald-600 text-white font-bold text-sm px-6 py-3 rounded-lg hover:bg-emerald-700 transition w-full justify-center">
        <i class="bi bi-arrow-left">
</i> Back to Main Hub
    </a>
</div>

</body>
</html>
